
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-setup
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: setup
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 33
        runAsGroup: 33
      containers:
        - name: wpcli
          image: {{ .Values.wordpress.cliImage }}
          env:
            {{- include "store.wpEnv" . | nindent 12 }}
            - name: HOME
              value: /tmp
            - name: WP_CLI_CACHE_DIR
              value: /tmp/wpcli-cache
            - name: SITE_URL
              value: {{ include "store.url" . | quote }}
            - name: SITE_TITLE
              value: {{ .Values.site.title | quote }}
            - name: ADMIN_USER
              value: {{ .Values.site.adminUser | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.site.adminEmail | quote }}
            - name: CURRENCY
              value: {{ .Values.site.currency | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: wp-admin-password
          command: ["sh", "-c"]
          args:
            - |
              set -eu

              echo "Waiting for wp-config.php..."
              until [ -f /var/www/html/wp-config.php ]; do sleep 3; done

              if ! wp core is-installed 2>/dev/null; then
                until wp core install --url="$SITE_URL" --title="$SITE_TITLE" \
                  --admin_user="$ADMIN_USER" --admin_password="$ADMIN_PASSWORD" \
                  --admin_email="$ADMIN_EMAIL" --skip-email; do
                  echo "DB not ready, retrying..."
                  sleep 5
                done
              fi

              wp option update home "$SITE_URL"
              wp option update siteurl "$SITE_URL"

              wp plugin is-installed woocommerce || wp plugin install woocommerce --version=9.8.0
              wp plugin is-active woocommerce || wp plugin activate woocommerce
              wp rewrite structure '/%postname%/' --hard
              wp wc tool run install_pages --user="$ADMIN_USER" || true

              wp option update woocommerce_currency "$CURRENCY"
              wp option update woocommerce_coming_soon no
              wp option update woocommerce_store_pages_only no
              wp option update woocommerce_ship_to_countries disabled
              wp option update woocommerce_cod_settings '{"enabled":"yes","title":"Cash on delivery"}' --format=json

              if [ "$(wp post list --post_type=product --format=count)" = "0" ]; then
                wp wc product create --name="Demo T-Shirt" --type=simple --regular_price=15 --user="$ADMIN_USER"
                wp wc product create --name="Demo Mug" --type=simple --regular_price=8 --user="$ADMIN_USER"
                wp wc product create --name="Demo Cap" --type=simple --regular_price=12 --user="$ADMIN_USER"
              fi

              echo "Setup complete."
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: content
              mountPath: /var/www/html
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-wordpress
