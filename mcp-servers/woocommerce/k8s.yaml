apiVersion: apps/v1
kind: Deployment
metadata:
  name: woocommerce-mcp
  namespace: urumi-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woocommerce-mcp
  template:
    metadata:
      labels:
        app: woocommerce-mcp
    spec:
      containers:
        - name: woocommerce-mcp
          image: urumi-woocommerce-mcp:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: WOOCOMMERCE_URL
              valueFrom:
                secretKeyRef:
                  name: woocommerce-mcp-secrets
                  key: woocommerce-url
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: woocommerce-mcp-secrets
                  key: woocommerce-consumer-key
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: woocommerce-mcp-secrets
                  key: woocommerce-consumer-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: woocommerce-mcp
  namespace: urumi-gateway
spec:
  selector:
    app: woocommerce-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
  type: ClusterIP
