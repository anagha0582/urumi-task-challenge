apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: woocommerce-mcp-ingress
  namespace: urumi-gateway
spec:
  podSelector:
    matchLabels:
      app: woocommerce-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: urumi-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: urumi-gateway
      ports:
        - protocol: TCP
          port: 3000
