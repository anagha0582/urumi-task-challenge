apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: store-mariadb-ingress
  namespace: woocommerce
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mariadb
      app.kubernetes.io/instance: store
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: woocommerce
          podSelector:
            matchLabels:
              app.kubernetes.io/component: wordpress
              app.kubernetes.io/instance: store
      ports:
        - protocol: TCP
          port: 3306
